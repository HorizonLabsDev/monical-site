@media (prefers-color-scheme: dark) { :root { --bg:#0B1512; --ink:#E7F3EF; --muted:#93AAA2; --line:#22362F; --brand-ink:#4FE0BE; --surface:#13231E; color-scheme: dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:400 17px/1.5 "Avenir Next","Helvetica Neue",system-ui,sans-serif; padding:24px max(16px,env(safe-area-inset-left,0px)); }

h1 { margin:0; font-size:2.4rem; letter-spacing:-.03em; } h1 span { color:var(--brand-ink); }
p { margin:0; color:var(--muted); }
nav { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
nav a { color:var(--ink); text-decoration:none; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:10px 18px; font-weight:600; }

<script>
(function () {
  var ok = ["de", "en", "fr", "it", "es", "el"], langs = navigator.languages || [navigator.language || 'de'], pick = 'de';
  for (var i = 0; i < langs.length; i++) {
    var c = String(langs[i]).slice(0, 2).toLowerCase();
    if (ok.indexOf(c) > -1) { pick = c; break; }
  }
  location.replace(pick + '/');
})();
</script>
